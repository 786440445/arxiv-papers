name: Daily arXiv Monitor

on:
  schedule:
    - cron: '0 2 * * *'  # 每天 02:00 UTC = 北京时间 10:00
  workflow_dispatch:  # 允许手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        ssh-key: ${{ secrets.DEPLOY_KEY }}  # 如果使用SSH key

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Fetch papers
      env:
        GIT_SSH_COMMAND: 'ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no'
      run: |
        python arxiv_monitor.py

    - name: Translate abstracts
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: |
        python translate_papers.py today

    - name: Render daily pages
      run: |
        python render_daily.py today

    - name: Commit and push changes
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"

        if git status --porcelain | grep -q '^'; then
          git add .
          git commit -m "Automated daily update: $(date +%Y-%m-%d)" || echo "No changes"
          git push origin master
        else
          echo "No new papers today"
        fi

    # 注意：Feishu通知需要在本地运行 monitor 时触发，Actions 不支持
